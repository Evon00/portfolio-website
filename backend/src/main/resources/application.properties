spring.application.name=backend

# ==========================================================================================================
# server
server.port=3100
server.forward-headers-strategy=native
# ==========================================================================================================

# ==========================================================================================================
# .env (backend 폴더 또는 모노레포 루트에서 실행)
# 기본 설정이 dev 환경이며, 운영 환경만 application-prod.properties로 덮어씀
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# ==========================================================================================================

# ==========================================================================================================
# DB
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway - 스키마는 Flyway로만 관리
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
# 장애시 오래 대기하지 않도록 제한 (기본 60초)
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# ==========================================================================================================

# ==========================================================================================================
# CORS
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# JWT (Access Token 15분, Refresh Token 14일)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=15m
jwt.refresh-token-expiry=14d

# Refresh Token 쿠키 (운영 환경은 secure=true)
cookie.path=/api/auth
cookie.same-site=Strict
cookie.secure=false
# ==========================================================================================================

# ==========================================================================================================
# Rate Limit - IP별 요청 횟수 제한 (가장 구체적인 경로의 규칙 하나만 적용)
# fail-open : Redis 장애시 통과 여부
rate-limit.rules.auth-login.paths=/api/auth/login
rate-limit.rules.auth-login.max-requests=10
rate-limit.rules.auth-login.window=5m
rate-limit.rules.auth-login.fail-open=false
rate-limit.rules.auth-refresh.paths=/api/auth/refresh
rate-limit.rules.auth-refresh.max-requests=30
rate-limit.rules.auth-refresh.window=1m
rate-limit.rules.auth-refresh.fail-open=true
rate-limit.rules.general.paths=/api/**
rate-limit.rules.general.max-requests=300
rate-limit.rules.general.window=1m
rate-limit.rules.general.fail-open=true
# ==========================================================================================================

# ==========================================================================================================
# Jackson - 날짜 응답을 +09:00 으로 전달
spring.jackson.time-zone=Asia/Seoul
# ==========================================================================================================

# ==========================================================================================================
# 파일 업로드 (장당 10MB, 프로젝트 이미지 최대 10장)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=110MB
# ==========================================================================================================

# ==========================================================================================================
# Actuator
management.endpoints.access.default=none
management.endpoint.health.access=read-only
# ==========================================================================================================

# ==========================================================================================================
# Swagger
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
# 전역 예외 처리 응답을 모든 API에 자동으로 추가하지 않음 (@ApiExceptionDocs 사용)
springdoc.override-with-generic-response=false
springdoc.default-produces-media-type=application/json
# ==========================================================================================================
