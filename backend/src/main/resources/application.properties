spring.application.name=backend

# ==========================================================================================================
# server
server.port=3100
server.forward-headers-strategy=native
# ==========================================================================================================

# ==========================================================================================================
# .env (backend 폴더 또는 모노레포 루트에서 실행)
# 기본 설정이 dev 환경이며, 운영 환경만 application-prod.properties로 덮어씀
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# ==========================================================================================================

# ==========================================================================================================
# DB
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway - 스키마는 Flyway로만 관리
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
# ==========================================================================================================

# ==========================================================================================================
# Jackson - 날짜 응답을 +09:00 으로 전달
spring.jackson.time-zone=Asia/Seoul
# ==========================================================================================================

# ==========================================================================================================
# 파일 업로드 (장당 10MB, 프로젝트 이미지 최대 10장)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=110MB
# ==========================================================================================================

# ==========================================================================================================
# Actuator
management.endpoints.access.default=none
management.endpoint.health.access=read-only
# ==========================================================================================================
